server:
  port: 8084

spring:
  application:
    name: qv-ms-events

  datasource:
    url: jdbc:mysql://localhost:3306/events_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: qv-ms-events
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  plans:
    url: http://localhost:8082        # qv-ms-plans
  notifications:
    url: http://localhost:8089        # qv-ms-notifications
  auth:
    url: http://localhost:8080        # qv-ms-auth

internal:
  api-key: